# Host development is loopback-only; the opt-in packaged runtime profile sets container binding.
server.address=127.0.0.1
spring.application.name=engine
# A real PostgreSQL connection is required; never embed credentials or use an in-memory fallback.
# Host development supplies SPRING_DATASOURCE_URL/USERNAME/PASSWORD; the packaged profile reads a file secret.
# Flyway owns the canonical schema through forward-only migrations in db/migration (P03.1);
# Hibernate only validates that entity mappings match it and never generates DDL.
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=validate
# Persistence contexts end with the transaction; views never trigger lazy loading.
spring.jpa.open-in-view=false
# Optional private derived workspace folders: set ENGINE_WORKSPACES_ROOT to an absolute
# persistent owner-controlled directory. Omitted by default; sealed PostgreSQL bytes remain
# canonical. Never point this at static web resources or a narration-runtime mount.
# Expose only status-only health; details and components stay hidden.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.jmx.enabled=false
# Health contract (docs/22 section 5): three separate groups, each HTTP 200 when UP, 503 otherwise.
#  liveness  - process only; never touches the database.
#  readiness - storage readiness: database reachable and schema matches the shipped migrations.
#  gameplay  - narration runtime/account state; separate so saved data stays usable without it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,schema
management.endpoint.health.group.gameplay.include=narrationRuntime
management.endpoint.health.group.gameplay.status.http-mapping.UNKNOWN=503
