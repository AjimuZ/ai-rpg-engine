# Host development is loopback-only; the opt-in packaged runtime profile sets container binding.
server.address=127.0.0.1
spring.application.name=engine
# A real PostgreSQL connection is required; never embed credentials or use an in-memory fallback.
# Host development supplies SPRING_DATASOURCE_URL/USERNAME/PASSWORD; the packaged profile reads a file secret.
# Flyway owns the canonical schema through forward-only migrations in db/migration (P03.1);
# Hibernate only validates that entity mappings match it and never generates DDL.
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=validate
# Persistence contexts end with the transaction; views never trigger lazy loading.
spring.jpa.open-in-view=false
# Optional private derived workspace folders: set ENGINE_WORKSPACES_ROOT to an absolute
# persistent owner-controlled directory. Omitted by default; sealed PostgreSQL bytes remain
# canonical. Never point this at static web resources or a narration-runtime mount.
# Expose only status-only health; details and components stay hidden.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.jmx.enabled=false
# Health contract (docs/22 section 5): three separate groups, each HTTP 200 when UP, 503 otherwise.
#  liveness  - process only; never touches the database.
#  readiness - storage readiness: database reachable and schema matches the shipped migrations.
#  gameplay  - narration runtime/account state; separate so saved data stays usable without it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,schema
management.endpoint.health.group.gameplay.include=narrationRuntime
management.endpoint.health.group.gameplay.status.http-mapping.UNKNOWN=503
# Narration task port (P08.1, docs/06). engine.inference.codex.transport is disabled (default),
# stdio or unix; disabled wires a port that answers every task UNAVAILABLE without I/O.
# stdio needs engine.inference.codex.command (absolute executable, then arguments, comma
# separated) and engine.inference.codex.working-directory; unix needs
# engine.inference.codex.socket-path. Optional bounds: queue-capacity (16), request-timeout
# (30s), handshake-timeout (30s), interrupt-timeout (10s), reconnect-initial (1s),
# reconnect-max (30s), stdio-grace (2s), max-sessions (256), runtime-cwd.
# Slot assignments are private owner settings with no shipped defaults:
# engine.inference.slots.<light|standard|deliberate>.model and .effort (both or neither), plus
# optional .backend (default engine.inference.backend, itself codex) and .alternatives
# (comma-separated model@effort, owner-approved degradation on the same backend).
# Profile resolution (P08.4, docs/06 section 9): engine.inference.allowlist.<backend> is the
# owner-approved model@effort list (the catalog of a backend that cannot enumerate models, a
# narrowing of a discovered one) and engine.inference.fixed-quality (light|standard|deliberate)
# routes every task through one slot. No model name is shipped as a default.
# Session scoping (P08.3, docs/06 section 7): every task runs in the session of its campaign,
# generation, role, audience and content/policy hashes; engine.inference.sessions.capacity
# (256, 1..4096) bounds the active scoped sessions, the least recently used being retired.
