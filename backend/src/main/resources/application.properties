# Host development is loopback-only. Container packaging must override this explicitly.
server.address=127.0.0.1
spring.application.name=engine
# A real PostgreSQL connection is required; never embed credentials or use an in-memory fallback.
# Supply SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# No canonical schema exists yet; P03 introduces the first forward-only migration.
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
# Expose only a minimal status; health groups and startup diagnostics belong to P02.5.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
# Boot enables probe groups by default; P02.5 will define their full contract.
management.endpoint.health.probes.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.jmx.enabled=false
