# Container-only runtime profile; the host development profile remains loopback-only.
# Compose publishes the engine port on host loopback, never all host interfaces.
server.address=0.0.0.0
# Require the mount before server/database startup. The override supports isolated tests;
# a configtree location must end with a slash. Never use an optional import or password default.
spring.config.import=configtree:${engine.secrets-directory:/run/secrets/}
# Share the database service's file without copying its contents into environment/arguments.
# Compose grants this file only to postgres and engine, never the runtime.
spring.datasource.password=${postgres_password}
# Real runtime socket in the shared IPC volume (docs/22 section 3): the hashed file, not the
# advertised symlink. The transport itself stays at its disabled default until the narration
# consumer (P08.5) and a packaged Docker check enable ENGINE_INFERENCE_CODEX_TRANSPORT=unix.
engine.inference.codex.socket-path=/tmp/codex-daemon-10001/bd2fc4d5dd4ec410275f7d5460680ca9c0ce1ef1b48e49b182f350ff18153681
