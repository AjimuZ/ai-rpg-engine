# Account-free application shell for P02.3, not a playable installation.
# ADR 0009 permits
# verified existing Java pins for local development; refresh is a release gate.
# Never publish database/runtime ports or attach the runtime to the data network.
name: rpg-engine

x-model-fetch-base: &model-fetch-base
  image: python:3.15.1-slim-trixie@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51
  profiles: [model-fetch]
  entrypoint: [python, -I, -B, /opt/model-fetch/model_fetch.py]
  # The launcher replaces this with the host account so that installed files stay the owner's.
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:mode=1777
  stop_grace_period: 15s

services:
  engine:
    build:
      context: .
      dockerfile: docker/engine/Dockerfile
    image: rpg-engine/engine:0.1.0
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SPRING_PROFILES_ACTIVE: packaged
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-engine}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-engine}
    secrets:
      - postgres_password
    # Only this service is reachable from the browser. Runtime inference egress
    # remains a different network, and control traffic uses the socket only.
    # `models`, `gateway` and `images` stay empty unless their optional services were selected,
    # and all three are internal: none gives the engine a route anywhere.
    networks: [web, data, models, gateway, images]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - content:/var/lib/engine/content
      - assets:/var/lib/engine/assets
      # Read-only filesystem access permits socket connections, not replacement.
      - runtime_ipc:/tmp/codex-daemon-10001:ro
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    depends_on:
      postgres: {condition: service_healthy}
      codex: {condition: service_healthy}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engine}
      POSTGRES_USER: ${POSTGRES_USER:-engine}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks: [data]
    volumes:
      # PostgreSQL 18 stores the cluster below this major-version-aware root.
      - database:/var/lib/postgresql
    # The official entrypoint needs root to initialize/chown a new volume, then
    # drops to postgres. Do not override its user or remove required capabilities.
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=3775
    healthcheck:
      # This is process availability, not application/schema readiness (P02.5).
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  codex:
    build:
      context: ./docker/codex-runtime
    image: rpg-engine/runtime:0.164.0
    # The runtime ignores SIGTERM as PID 1, so docker stop would wait the whole
    # grace period and then SIGKILL it (P01.4). A minimal init forwards the
    # signal and reaps children, letting the runtime exit promptly.
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Inference/sign-in egress is required; this network never reaches postgres.
    networks: [inference]
    volumes:
      # Account state is private to this service; the engine mounts IPC only.
      - runtime_account:/var/lib/runtime/home
      - runtime_workspace:/var/lib/runtime/workspace
      # P01 proved the advertised socket is a symlink: share its real directory.
      - runtime_ipc:/tmp/codex-daemon-10001
    tmpfs:
      - /run/runtime:uid=10001,gid=10001,mode=0700
      - /tmp:mode=1777
    healthcheck:
      # Presence proves a listener only, never account or inference readiness.
      test: [CMD, test, -S, /tmp/codex-daemon-10001/bd2fc4d5dd4ec410275f7d5460680ca9c0ce1ef1b48e49b182f350ff18153681]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # Optional local text backend (P21.2, docs/34). Only `--profile models` selects it,
  # so a plain `up` neither pulls nor starts it. It publishes nothing and its single
  # network is internal: the engine is its only peer, and it has no route to the
  # Internet, PostgreSQL or the runtime. Keep this pin equal to MODEL_SERVER_IMAGE
  # in start.sh; test_compose.py compares them.
  models:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11960@sha256:4ccae195bf542f7844301ae06891baa32a7551cb16de8428af6e929403d4292c
    profiles: [models]
    # Router mode runs one child server per loaded model: the init reaps them and
    # forwards stop signals.
    init: true
    # The image declares no USER and would otherwise run as root.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Docker applies this request when the service starts; no other service depends on it.
    gpus: all
    # Without a loaded model router mode needs no tuning; layers, context and cache
    # flags come from later P21.2 measurements.
    command: [--host, 0.0.0.0, --port, "8080", --models-dir, /models, --models-max, "1"]
    environment:
      # User 65534 has no writable home; keep the server's cache lookup on tmpfs.
      LLAMA_CACHE: /tmp/llama-cache
    networks: [models]
    volumes:
      # A missing directory must fail startup, not appear empty and root-owned.
      - type: bind
        source: ${MODELS_DIR:-./.local/models}
        target: /models
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    healthcheck:
      # This is process availability only, never a loaded or usable model.
      test: [CMD, curl, --fail, --silent, --output, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # Optional local image backend (P21.5-A, docs/34). Only `--profile images` selects or
  # builds it, so a plain `up` builds and starts nothing of it. It publishes nothing and its
  # single network is internal: the engine is its only peer, and it has no route to the
  # Internet, PostgreSQL or the runtime. It reads the same model directory as `models`.
  image-worker:
    build:
      context: ./docker/image-worker
    image: rpg-engine/image-worker:0.1.0
    profiles: [images]
    # Library worker threads are reaped and stop signals forwarded by the init.
    init: true
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Docker applies this request when the service starts; no other service depends on it.
    gpus: all
    environment:
      # The owner's switch for private use; a job request has no way to change it (docs/34).
      IMAGE_CONTENT_POLICY: ${IMAGE_CONTENT_POLICY:-safe}
    networks: [images]
    volumes:
      # A missing directory must fail startup, not appear empty and root-owned.
      - type: bind
        source: ${MODELS_DIR:-./.local/models}
        target: /models
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:uid=10003,gid=10003,mode=0700
    healthcheck:
      # This is process availability only, never a loaded or usable model.
      test: [CMD, python, -I, -B, /opt/image-worker/image_worker.py, --health]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
      start_interval: 1s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # One-off helpers of `./start.sh --models fetch` (P21.2, docs/34). Only their profile or
  # a `compose run` selects them, they join no project network, and no other service
  # depends on them. `models-license` shows catalog facts with no network and no model
  # directory; only `models-fetch`, run after the owner's confirmation, has egress and
  # write access to the directory that the model server mounts read-only.
  models-license:
    <<: *model-fetch-base
    network_mode: none
    volumes:
      - type: bind
        source: ./docker/model-fetch
        target: /opt/model-fetch
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./backend/src/main/resources/inference/model-catalog.json
        target: /catalog/model-catalog.json
        read_only: true
        bind: {create_host_path: false}

  models-fetch:
    <<: *model-fetch-base
    network_mode: bridge
    volumes:
      - type: bind
        source: ./docker/model-fetch
        target: /opt/model-fetch
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./backend/src/main/resources/inference/model-catalog.json
        target: /catalog/model-catalog.json
        read_only: true
        bind: {create_host_path: false}
      # The launcher creates the directory; a missing one must fail, not appear root-owned.
      - type: bind
        source: ${MODELS_DIR:-./.local/models}
        target: /models
        bind: {create_host_path: false}

  # Optional gateway to hosted APIs and custom endpoints (P21.3, docs/34). Only
  # `--profile gateway` selects it and no other service depends on it. It alone joins
  # `gateway_egress`; the engine reaches it over the internal `gateway` network and never
  # receives a key. Both inputs are read-only host paths that must already exist: the
  # allowlist is a file of destinations, and each key is one file in the secrets directory.
  # Its one writable path is a volume of budget counts, which holds no key.
  gateway:
    build:
      context: ./docker/gateway
    image: rpg-engine/gateway:0.1.0
    profiles: [gateway]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [gateway, gateway_egress]
    volumes:
      - type: bind
        source: ${GATEWAY_DESTINATIONS_FILE:-./.local/gateway/destinations.json}
        target: /etc/gateway/destinations.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GATEWAY_KEYS_DIR:-./.local/secrets/gateway}
        target: /run/secrets/gateway
        read_only: true
        bind: {create_host_path: false}
      - gateway_state:/var/lib/gateway
    healthcheck:
      # This is process availability only, never a destination, key or provider answering.
      test: [CMD, python, -I, -B, /opt/gateway/gateway.py, --health]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
      start_interval: 1s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  web: {}
  data:
    internal: true
  inference: {}
  # No route gateway on these three: containers on them have no route off them.
  models:
    internal: true
  gateway:
    internal: true
  images:
    internal: true
  # The only network of the gateway service with a route out; nothing else joins it.
  gateway_egress: {}

volumes:
  content: {}
  assets: {}
  database: {}
  runtime_account: {}
  runtime_workspace: {}
  # Identifiers, period labels and counts of the gateway's budgets: never a key.
  gateway_state: {}
  # Only the control socket/lock live here. No account or campaign state at rest.
  runtime_ipc:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=10001,gid=10001,mode=0700

secrets:
  # Local Compose file secrets are read-only binds, not an encrypted secret store.
  # start.sh creates this ignored file once (random, never overwritten); fail if absent.
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./.local/secrets/postgres-password}
