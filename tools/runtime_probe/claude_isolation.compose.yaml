# P20.1-B isolation fixture for the second narration client. Not a product Compose file.
#
# Used only by test_claude_isolation.py, as `docker compose -p ai-rpg-engine-claude-isolation
# -f claude_isolation.compose.yaml`. The unmodified pinned client (the P20.1-A probe image) runs
# one `-p` case per `compose run` through claude_isolation_fixture/run-case.sh. Its documented
# base-URL override points at MessagesProvider.java, so its whole agent loop runs while only the
# upstream answers are scripted.
#
# Isolation in this fixture:
# - `fixture` is an internal network with external routing disabled and no published ports,
#   so no request can reach a real service, an account or a telemetry endpoint;
# - there is no account volume and no real credential: the only key is a fixture string the
#   scripted upstream ignores, and every planted credential is a synthetic sentinel;
# - root filesystems are read-only, all capabilities are dropped, every process runs as
#   UID/GID 10001, and the client's home, workspace and /tmp are throw-away tmpfs mounts.
name: ai-rpg-engine-claude-isolation

services:
  provider:
    # The pinned Java 21 build image from ADR 0009, as in session.compose.yaml.
    image: eclipse-temurin:21.0.12.1_1-jdk-resolute@sha256:3b59c79a788985965c89203cca233c53893f62293108bb825264740fac926724
    networks: [fixture]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    environment:
      HOME: /tmp
      JAVA_TOOL_OPTIONS: -XX:-UsePerfData -Xshare:off
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ./MessagesProvider.java:/probe/MessagesProvider.java:ro
    entrypoint: ["java", "/probe/MessagesProvider.java"]
    command: ["8080", "/tmp/ready"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  client:
    image: ai-rpg-engine-runtime-probe/claude:2.1.323
    networks: [fixture]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    environment:
      ANTHROPIC_BASE_URL: http://provider:8080
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      # Read only by run-case.sh: the isolated profile passes the key to the client, the
      # unrestricted control does not. Neither value is a credential.
      FIXTURE_API_KEY: fixture-api-key-not-a-credential
      FIXTURE_MODEL: claude-sonnet-4-5
    tmpfs:
      - /var/lib/runtime/home:uid=10001,gid=10001,mode=0700
      - /var/lib/runtime/workspace:uid=10001,gid=10001,mode=0700
      # The client may unpack bundled helpers into /tmp and run them.
      - /tmp:exec,mode=1777
    volumes:
      - ./claude_isolation_fixture:/fixture:ro
    entrypoint: ["/bin/sh", "/fixture/run-case.sh"]
    depends_on:
      provider:
        condition: service_healthy

networks:
  # Disable external routing; this fixture publishes no service ports.
  fixture:
    internal: true
